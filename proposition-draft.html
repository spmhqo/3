<head>

  <style>
    :root{--ink:#182b2a;--muted:#667674;--line:#dce4df;--paper:#fff;--canvas:#f7f6f2;--green:#155b4b;--green-dark:#104b3e;--soft:#edf5f1;--amber:#f3efe4;--shadow:0 12px 32px rgba(25,49,43,.07);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;color:var(--ink);background:var(--canvas);font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:1rem}body{margin:0;line-height:1.65;overflow-wrap:anywhere}button,a{font:inherit}a{color:var(--green)}
    .page-header{padding:clamp(1.5rem,5vw,3.2rem) max(1rem,calc((100vw - 1440px)/2));background:linear-gradient(135deg,#e6f0eb,#f6f3e9);border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 .35rem;color:var(--green);font-weight:750;letter-spacing:.08em;text-transform:uppercase;font-size:.76rem}.page-header h1{font-size:clamp(1.5rem,4vw,2.5rem);line-height:1.25;max-width:950px;margin:0}.page-header p{margin:.6rem 0 0;color:var(--muted)}
    .layout{width:min(1440px,100%);margin:0 auto;padding:1.25rem;display:grid;grid-template-columns:260px minmax(0,1fr);gap:1.25rem;align-items:start}
    .prompt-nav{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1rem;box-shadow:var(--shadow)}.prompt-nav h2{font-size:1rem;margin:0 0 .75rem}.prompt-nav ol{list-style:none;padding:0;margin:0;display:grid;gap:.3rem}.prompt-nav a{display:block;padding:.55rem .65rem;border-radius:10px;text-decoration:none;color:var(--ink);font-size:.86rem;line-height:1.4}.prompt-nav a:hover,.prompt-nav a:focus-visible{background:var(--soft);outline:2px solid transparent;color:var(--green-dark)}.prompt-nav .nav-number{display:inline-grid;place-items:center;width:1.65rem;height:1.65rem;margin-right:.4rem;border-radius:50%;background:var(--soft);color:var(--green);font-size:.75rem;font-weight:750;vertical-align:middle;flex:none}
    #conversation{min-width:0}.turn{scroll-margin-top:1rem;margin:0 0 1.25rem;padding:clamp(.8rem,2.6vw,1.35rem);background:#f0f2ed;border:1px solid var(--line);border-radius:20px}.turn-heading{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .8rem}.turn-heading h2{font-size:1rem;margin:0;color:var(--green-dark)}.turn-heading a{font-size:.82rem;text-decoration:none;font-weight:650}.message{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:clamp(.9rem,2.4vw,1.35rem);margin-top:.75rem;box-shadow:0 4px 14px rgba(25,49,43,.035)}.message.prompt-card{border-left:4px solid #b88b3c}.message.answer-card{border-left:4px solid #4c8a76}.message-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-bottom:.65rem;margin-bottom:.65rem;border-bottom:1px solid #edf0ec}.message-head h3{font-size:.92rem;margin:0}.copy-button{border:1px solid #bfd1c8;color:var(--green-dark);background:#f5faf7;border-radius:999px;padding:.45rem .8rem;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}.copy-button:hover{background:#e8f3ed}.copy-button:focus-visible{outline:3px solid #90b9a6;outline-offset:2px}.copy-button[data-copied="true"]{background:#dff1e7;border-color:#8bb89d}
    .markdown{min-width:0}.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{line-height:1.35;margin:1.4em 0 .55em;color:#203b35}.markdown h1{font-size:1.7rem}.markdown h2{font-size:1.45rem}.markdown h3{font-size:1.2rem}.markdown h4{font-size:1.06rem}.markdown p{margin:.7em 0}.markdown strong{color:#203b35}.markdown blockquote{margin:1rem 0;padding:.65rem 1rem;border-left:4px solid #8cae9e;background:#f4f8f5;color:#3e5750;border-radius:0 10px 10px 0}.markdown blockquote>:first-child{margin-top:0}.markdown blockquote>:last-child{margin-bottom:0}.markdown hr{border:0;border-top:1px solid var(--line);margin:1.3rem 0}.markdown ul,.markdown ol{padding-left:1.5rem;margin:.65em 0}.markdown li{padding-left:.15rem;margin:.28rem 0}.markdown code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f0f2ed;padding:.1em .3em;border-radius:5px;font-size:.92em}.markdown a{overflow-wrap:anywhere}.markdown-table-wrap{width:100%;margin:1rem 0;border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:#fff}.markdown table{width:100%;border-collapse:collapse;font-size:.94rem}.markdown th,.markdown td{padding:.7rem .8rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}.markdown th{background:#eef4f0;color:#24443a;font-weight:750}.markdown tr:last-child td{border-bottom:0}.markdown tr:nth-child(even) td{background:#fbfcfa}.markdown .empty-state{color:var(--muted)}
    .site-footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.86rem;padding:1.5rem 1rem 2rem;margin-top:1rem}.toast{position:fixed;left:50%;bottom:1rem;z-index:10;transform:translate(-50%,1rem);opacity:0;pointer-events:none;background:#163e34;color:#fff;padding:.65rem 1rem;border-radius:999px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;font-size:.9rem}.toast.visible{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.layout{grid-template-columns:1fr;padding:.85rem}.prompt-nav{position:relative;top:auto;max-height:none;padding:.85rem}.prompt-nav h2{margin-bottom:.55rem}.prompt-nav ol{display:flex;overflow-x:auto;gap:.45rem;padding-bottom:.2rem;scroll-snap-type:x proximity}.prompt-nav li{flex:0 0 min(250px,75vw);scroll-snap-align:start}.prompt-nav a{height:100%;background:#fafbf9;border:1px solid #edf0ec}.page-header{padding-left:1rem;padding-right:1rem}}
    @media(max-width:640px){body{font-size:15px}.layout{padding:.65rem;gap:.7rem}.turn{padding:.65rem;border-radius:16px;margin-bottom:.8rem}.message{padding:.8rem;border-radius:12px}.message-head{align-items:flex-start}.copy-button{padding:.42rem .68rem;font-size:.78rem}.markdown h1{font-size:1.45rem}.markdown h2{font-size:1.26rem}.markdown h3{font-size:1.12rem}.markdown-table-wrap{overflow:visible;border:0;background:transparent}.markdown table,.markdown tbody{display:block;width:100%}.markdown thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.markdown tr{display:block;margin:.7rem 0;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(25,49,43,.04)}.markdown tr:nth-child(even) td{background:#fff}.markdown td{display:grid;grid-template-columns:minmax(6.25rem,35%) minmax(0,1fr);gap:.65rem;padding:.58rem .68rem;border-bottom:1px solid #edf0ec;overflow-wrap:anywhere}.markdown td:last-child{border-bottom:0}.markdown td::before{content:attr(data-label);font-weight:750;color:#426257}.page-footer{padding-bottom:1.5rem}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}

  <script>
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const plainText = value => value.replace(/[`*_~>#]/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim();
    function inlineMarkdown(source) {
      let html = escapeHtml(source);
      const stash = [];
      html = html.replace(/`([^`]+)`/g, (_, code) => { stash.push('<code>' + code + '</code>'); return `\u0000${stash.length-1}\u0000`; });
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/gi, (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>');
      html = html.replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
      return html.replace(/\u0000(\d+)\u0000/g, (_, index) => stash[Number(index)]);
    }
    const listMarker = line => { const match = line.match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/); return match ? {indent:match[1].length, ordered:/^\d/.test(match[2]), body:match[3]} : null; };
    const isRule = line => /^\s{0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})\s*$/.test(line);
    const isTableRow = line => /^\s*\|.*\|\s*$/.test(line);
    function splitCells(line) { return line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(cell => cell.replace(/\\\|/g, '|').trim()); }
    function renderTable(lines, start) {
      const headers = splitCells(lines[start]);
      const alignments = splitCells(lines[start+1]).map(cell => cell.startsWith(':') && cell.endsWith(':') ? 'center' : cell.endsWith(':') ? 'right' : cell.startsWith(':') ? 'left' : '');
      let index = start + 2, rows = [];
      while (index < lines.length && isTableRow(lines[index])) { rows.push(splitCells(lines[index])); index++; }
      let html = '<div class="markdown-table-wrap" role="region" aria-label="Responsive table"><table><thead><tr>';
      headers.forEach((cell, col) => { const align = alignments[col] ? ` style="text-align:${alignments[col]}"` : ''; html += `<th scope="col"${align}>${inlineMarkdown(cell)}</th>`; });
      html += '</tr></thead><tbody>';
      rows.forEach(row => { html += '<tr>'; headers.forEach((header, col) => { const align = alignments[col] ? ` style="text-align:${alignments[col]}"` : ''; html += `<td data-label="${escapeHtml(plainText(header))}"${align}>${inlineMarkdown(row[col] || '')}</td>`; }); html += '</tr>'; });
      return {html:html + '</tbody></table></div>', index};
    }
    function renderList(lines, start) {
      const first = listMarker(lines[start]), base = first.indent, ordered = first.ordered, tag = ordered ? 'ol' : 'ul';
      const items = []; let index = start;
      while (index < lines.length) {
        const marker = listMarker(lines[index]);
        if (!marker || marker.indent !== base || marker.ordered !== ordered) break;
        let item = inlineMarkdown(marker.body); index++;
        while (index < lines.length) {
          if (!lines[index].trim()) {
            let look = index + 1; while (look < lines.length && !lines[look].trim()) look++;
            const nextMarker = look < lines.length ? listMarker(lines[look]) : null;
            if (nextMarker && nextMarker.indent === base && nextMarker.ordered === ordered) { index = look; break; }
            if (nextMarker && nextMarker.indent > base) { index = look; continue; }
            break;
          }
          const next = listMarker(lines[index]);
          if (next && next.indent === base) break;
          if (next && next.indent > base) {
            const nested = renderList(lines, index); item += nested.html; index = nested.index; continue;
          }
          if (/^\s{2,}\S/.test(lines[index])) { item += '<br>' + inlineMarkdown(lines[index].trim()); index++; continue; }
          break;
        }
        items.push(`<li>${item}</li>`);
      }
      return {html:`<${tag}>${items.join('')}</${tag}>`, index};
    }
    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n'); let index = 0, html = '';
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index++; continue; }
        if (isRule(line)) { html += '<hr>'; index++; continue; }
        const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) { const level = heading[1].length; html += `<h${level}>${inlineMarkdown(heading[2])}</h${level}>`; index++; continue; }
        if (isTableRow(line) && index + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index+1])) {
          const table = renderTable(lines, index); html += table.html; index = table.index; continue;
        }
        if (/^\s*>/.test(line)) {
          const quote = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) { quote.push(lines[index].replace(/^\s*> ?/, '')); index++; }
          html += `<blockquote>${renderMarkdown(quote.join('\n'))}</blockquote>`; continue;
        }
        if (listMarker(line)) { const list = renderList(lines, index); html += list.html; index = list.index; continue; }
        const paragraph = [line]; index++;
        while (index < lines.length && lines[index].trim() && !isRule(lines[index]) && !/^\s{0,3}#{1,6}\s/.test(lines[index]) && !/^\s*>/.test(lines[index]) && !listMarker(lines[index]) && !(isTableRow(lines[index]) && index+1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index+1]))) { paragraph.push(lines[index]); index++; }
        html += `<p>${inlineMarkdown(paragraph.join(' ').trim())}</p>`;
      }
      return html;
    }
    async function loadConversations() {
      const packed = document.getElementById('packed-conversations').textContent.trim();
      const bytes = Uint8Array.from(atob(packed), char => char.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return JSON.parse(await new Response(stream).text());
    }
    function makeCopyButton(label, content, kind) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'copy-button'; button.textContent = label; button.dataset.defaultLabel = label; button.dataset.copyText = content; button.setAttribute('aria-label', `${label} ${kind}`); return button;
    }
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('visible'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('visible'), 1700); }
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return; }
      const field = document.createElement('textarea'); field.value = text; field.setAttribute('readonly',''); field.style.position = 'fixed'; field.style.opacity = '0'; document.body.appendChild(field); field.select(); const success = document.execCommand('copy'); field.remove(); if (!success) throw new Error('Clipboard copy failed');
    }
    document.addEventListener('click', async event => {
      const button = event.target.closest('.copy-button'); if (!button) return;
      try { await copyText(button.dataset.copyText); button.textContent = 'Copied'; button.dataset.copied = 'true'; showToast(`${button.dataset.defaultLabel} copied`); setTimeout(() => { button.textContent = button.dataset.defaultLabel; delete button.dataset.copied; }, 1600); }
      catch (_) { showToast('Could not copy. Select and copy the text manually.'); }
    });
    (async () => {
      const conversation = document.getElementById('conversation'), links = document.getElementById('prompt-links');
      try {
        const items = await loadConversations();
        document.getElementById('turn-count').textContent = `${items.length} prompts · ${items.length} answers`;
        items.forEach((item, index) => {
          const number = index + 1, turn = document.createElement('article'); turn.className = 'turn'; turn.id = `turn-${number}`;
          const promptId = `prompt-${number}`;
          const navItem = document.createElement('li'), navLink = document.createElement('a'); navLink.href = `#${promptId}`;
          navLink.innerHTML = `<span class="nav-number">${number}</span>${escapeHtml(plainText(item.prompt).slice(0, 76) || `Prompt ${number}`)}${plainText(item.prompt).length > 76 ? '…' : ''}`;
          navItem.appendChild(navLink); links.appendChild(navItem);
          const top = document.createElement('div'); top.className = 'turn-heading'; top.innerHTML = `<h2>Conversation ${number}</h2><a href="#prompt-${number}">Go to prompt ↑</a>`; turn.appendChild(top);
          const prompt = document.createElement('section'); prompt.className = 'message prompt-card'; prompt.id = promptId;
          const pHead = document.createElement('div'); pHead.className = 'message-head'; pHead.innerHTML = `<h3>Prompt ${number}</h3>`; pHead.appendChild(makeCopyButton('Copy Prompt', item.prompt, `prompt ${number}`)); prompt.appendChild(pHead);
          const pBody = document.createElement('div'); pBody.className = 'markdown'; pBody.innerHTML = renderMarkdown(item.prompt); prompt.appendChild(pBody); turn.appendChild(prompt);
          const answer = document.createElement('section'); answer.className = 'message answer-card'; answer.id = `answer-${number}`;
          const aHead = document.createElement('div'); aHead.className = 'message-head'; aHead.innerHTML = `<h3>Answer ${number}</h3>`; aHead.appendChild(makeCopyButton('Copy Answer', item.answer, `answer ${number}`)); answer.appendChild(aHead);
          const aBody = document.createElement('div'); aBody.className = 'markdown'; aBody.innerHTML = renderMarkdown(item.answer); answer.appendChild(aBody); turn.appendChild(answer);
          conversation.appendChild(turn);
        });
        conversation.setAttribute('aria-busy','false');
      } catch (error) {
        conversation.setAttribute('aria-busy','false'); conversation.innerHTML = '<p class="empty-state">The conversation could not be loaded in this browser.</p>'; document.getElementById('turn-count').textContent = 'Unable to load conversation';
      }
    })();
  </script>
